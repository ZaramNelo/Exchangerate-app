# A top-level key that identifies the file as a Render Blueprint
services:
  # The list of services to deploy
  - type: cron
    name: exchangerate-daily
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python update_rates.py"
    cronSchedule: "0 6 * * *"  # Runs every day at 06:00 UTC
    envVars:
      - key: SUPABASE_URL
        fromSecret: SUPABASE_URL
      - key: SUPABASE_KEY
        fromSecret: SUPABASE_KEY